apiVersion: v1
kind: Pod
metadata:
  name: roadsterpod
  labels:
    app: roadster
    version: "1.0"
spec:
  containers:
    - name: roadster
      image: jcrnode.com/docker/roadster:2.0
      ports:
        - name: http
          containerPort: 8082
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /actuator/health/readiness
          port: 8082
        initialDelaySeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /actuator/health/liveness
          port: 8082
        initialDelaySeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        requests:
          cpu: "250m"
          memory: "320Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      env:
        - name: originCountry
          valueFrom:
            configMapKeyRef:
              name: roadsterconfigmap
              key: origin-country
        - name: city
          valueFrom:
            configMapKeyRef:
              name: roadsterconfigmap
              key: city      
        - name: age
          valueFrom:
            configMapKeyRef:
              name: roadsterconfigmap
              key: age
        - name: gender      
          valueFrom:
            configMapKeyRef:
              name: roadsterconfigmap
              key: gender
        - name:   internationalPlaces
          valueFrom:
            configMapKeyRef:
              name: roadsterconfigmap
              key: international-places
